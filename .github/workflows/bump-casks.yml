name: Bump casks

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-casks
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump casks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/bump-casks.sh

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain Casks)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898132+github-actions[bot]@users.noreply.github.com"
            git add Casks
            git commit -m "chore: bump casks to latest releases"
            git push
          else
            echo "No cask changes."
          fi
